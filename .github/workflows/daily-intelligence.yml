name: Daily Intelligence

on:
  # Automatic publishing runs locally on the Mac. Keep this workflow only for
  # an explicitly requested recovery run because it consumes the API secret.
  workflow_dispatch:
    inputs:
      report_date:
        description: "补跑日期（YYYY-MM-DD）；留空则使用北京时间当天"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-intelligence-publish
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: "gpt-5.6-sol"
      OPENAI_REASONING_EFFORT: "low"
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
      OPENAI_TIMEOUT_SECONDS: "240"

    steps:
      - name: Checkout archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve report date
        id: report
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.report_date }}
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            report_date="$INPUT_DATE"
          else
            report_date="$(TZ=Asia/Shanghai date +%F)"
          fi
          if [[ ! "$report_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid report date: $report_date" >&2
            exit 1
          fi
          echo "date=$report_date" >> "$GITHUB_OUTPUT"

      - name: Generate Daily Intelligence
        shell: bash
        run: |
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "OPENAI_API_KEY is unavailable; refusing to publish an incomplete edition." >&2
            exit 1
          fi
          python automation/dios.py --date "${{ steps.report.outputs.date }}" --archive-root "$GITHUB_WORKSPACE"

      - name: Publish archive update
        shell: bash
        run: |
          git config user.name "daily-intelligence-bot"
          git config user.email "daily-intelligence-bot@users.noreply.github.com"
          git add index.html latest.html search-index.json 2026/
          if git diff --cached --quiet; then
            echo "No archive changes to publish."
            exit 0
          fi
          git commit -m "Update Daily Intelligence ${{ steps.report.outputs.date }}"
          git push
