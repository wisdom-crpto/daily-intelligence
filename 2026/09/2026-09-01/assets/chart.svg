<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Three measurement layers for AI distribution</title><desc id="desc">Evidence ladder separating disclosed reach, observable behavior and verified incrementality.</desc>
<rect width="1200" height="680" rx="32" fill="#071424"/><text x="72" y="82" fill="#eaf2ff" font-family="Arial,sans-serif" font-size="38" font-weight="700">AI distribution: three measurement layers</text>
<text x="72" y="122" fill="#91a7c2" font-family="Arial,sans-serif" font-size="21">Do not collapse reach, observed behavior, and verified incrementality into one number.</text>
<rect x="72" y="176" width="1056" height="116" rx="22" fill="#14345a"/><circle cx="130" cy="234" r="32" fill="#62d6ff"/><text x="119" y="244" fill="#071424" font-family="Arial" font-size="30" font-weight="700">1</text><text x="190" y="222" fill="#ffffff" font-family="Arial" font-size="29" font-weight="700">Disclosed reach</text><text x="190" y="259" fill="#bcd0e8" font-family="Arial" font-size="21">Users, countries, advertisers — company-reported scale</text>
<rect x="132" y="324" width="936" height="116" rx="22" fill="#1a4b61"/><circle cx="190" cy="382" r="32" fill="#66e0c2"/><text x="179" y="392" fill="#071424" font-family="Arial" font-size="30" font-weight="700">2</text><text x="250" y="370" fill="#ffffff" font-family="Arial" font-size="29" font-weight="700">Observable behavior</text><text x="250" y="407" fill="#c7e8df" font-family="Arial" font-size="21">Impressions, visits, attributed conversions — platform-visible actions</text>
<rect x="192" y="472" width="816" height="116" rx="22" fill="#5b3f82"/><circle cx="250" cy="530" r="32" fill="#d6adff"/><text x="239" y="540" fill="#1b0b2d" font-family="Arial" font-size="30" font-weight="700">3</text><text x="310" y="518" fill="#ffffff" font-family="Arial" font-size="29" font-weight="700">Verified incrementality</text><text x="310" y="555" fill="#e0d2f2" font-family="Arial" font-size="21">Controlled lift, retention, net publisher value — still unobserved broadly</text>
<text x="72" y="638" fill="#91a7c2" font-family="Arial" font-size="18">Evidence status: company disclosure → platform measurement → independent outcome validation</text></svg>
