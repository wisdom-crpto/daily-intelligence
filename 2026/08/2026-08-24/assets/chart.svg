<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Controlled AI Economics</title><desc id="d">Privacy, safety monitoring and capital cost form three gates for enterprise AI.</desc><rect width="1200" height="650" rx="28" fill="#07101d"/><text x="70" y="82" fill="#eef8ff" font-family="system-ui,sans-serif" font-size="42" font-weight="700">Controlled AI Economics</text><text x="70" y="125" fill="#8aa4bf" font-family="system-ui,sans-serif" font-size="22">Capability reaches production only through three verifiable gates</text><g font-family="system-ui,sans-serif"><rect x="70" y="185" width="300" height="300" rx="24" fill="#102842" stroke="#39c6ff" stroke-width="3"/><text x="105" y="245" fill="#6bd8ff" font-size="29" font-weight="700">01 Privacy</text><text x="105" y="300" fill="#e1edf8" font-size="25">Zero Data Retention</text><text x="105" y="344" fill="#9fb4c9" font-size="20">Retention · access · deletion</text><rect x="450" y="185" width="300" height="300" rx="24" fill="#17233b" stroke="#9a83ff" stroke-width="3"/><text x="485" y="245" fill="#b9a9ff" font-size="29" font-weight="700">02 Safety</text><text x="485" y="300" fill="#e1edf8" font-size="25">Cross-turn monitoring</text><text x="485" y="344" fill="#9fb4c9" font-size="20">~20% compute estimate</text><rect x="830" y="185" width="300" height="300" rx="24" fill="#22293a" stroke="#ffba69" stroke-width="3"/><text x="865" y="245" fill="#ffcb8d" font-size="29" font-weight="700">03 Return</text><text x="865" y="300" fill="#e1edf8" font-size="25">Higher duration hurdle</text><text x="865" y="344" fill="#9fb4c9" font-size="20">Cash flow · adoption · loss</text><path d="M370 335h80M750 335h80" stroke="#72d8ff" stroke-width="8"/><path d="m432 318 18 17-18 17M812 318l18 17-18 17" fill="none" stroke="#72d8ff" stroke-width="8"/></g><text x="70" y="570" fill="#dcecff" font-family="system-ui,sans-serif" font-size="25">Winning metric: verifiable 