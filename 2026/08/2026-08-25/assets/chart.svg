<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Context-to-Value Pipeline</title><desc id="desc">Work context flows through AI agents and optimized compute into verified outcomes, filtered by capital cost.</desc>
  <rect width="1200" height="680" rx="32" fill="#081426"/><text x="70" y="85" fill="#e8f1ff" font-family="sans-serif" font-size="38" font-weight="700">Context-to-Value Pipeline</text><text x="70" y="125" fill="#8fa8c8" font-family="sans-serif" font-size="20">生产力来自上下文保真、系统效率与结果验证的共同作用</text>
  <g font-family="sans-serif"><rect x="70" y="210" width="225" height="210" rx="22" fill="#12365b"/><text x="95" y="265" fill="#67d4ff" font-size="22">01 工作上下文</text><text x="95" y="310" fill="#fff" font-size="28" font-weight="700">Teams / Code</text><text x="95" y="350" fill="#b9c9db" font-size="18">需求 · 决策 · 约束</text>
  <rect x="335" y="210" width="225" height="210" rx="22" fill="#18466c"/><text x="360" y="265" fill="#79e0c3" font-size="22">02 代理执行</text><text x="360" y="310" fill="#fff" font-size="28" font-weight="700">Tools / Routes</text><text x="360" y="350" fill="#b9c9db" font-size="18">权限 · 调用 · 回写</text>
  <rect x="600" y="210" width="225" height="210" rx="22" fill="#155e75"/><text x="625" y="265" fill="#a5f3fc" font-size="22">03 系统优化</text><text x="625" y="310" fill="#fff" font-size="28" font-weight="700">Ray / GPU</text><text x="625" y="350" fill="#d1eef4" font-size="18">吞吐 · 调度 · 成本</text>
  <rect x="865" y="210" width="265" height="210" rx="22" fill="#176b5b"/><text x="890" y="265" fill="#b7f7dd" font-size="22">04 经验证结果</text><text x="890" y="310" fill="#fff" font-size="28" font-weight="700">Quality / ROI</text><text x="890" y="350" fill="#d5f4e9" font-size="18">完成率 · 缺陷 · 现金流</text>
  <path d="M295 315h40M560 315h40M825 315h40" stroke="#67d4ff" stroke-width="8" stroke-linecap="round"/>
  <rect x="210" y="500" width="780" height="92" rx="46" fill="#17243a" stroke="#415a77"/><text x="600" y="540" text-anchor="middle" fill="#f8d57e" font-size="22">资本筛选器</text><text x="600" y="570" text-anchor="middle" fill="#d8e2ef" font-size="20">GDP · 企业利润 · PCE · 贴现率</text></g>
</svg>
