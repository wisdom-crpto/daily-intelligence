<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">AI Value Measurement Ladder</title><desc id="desc">Four steps from polished output to transferable capability.</desc>
  <rect width="960" height="520" rx="28" fill="#0b1220"/><text x="64" y="72" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700">AI Value Measurement Ladder</text>
  <g font-family="sans-serif"><rect x="80" y="370" width="200" height="78" rx="12" fill="#1d4ed8"/><text x="180" y="402" text-anchor="middle" fill="white" font-size="20" font-weight="700">成品更好</text><text x="180" y="430" text-anchor="middle" fill="#dbeafe" font-size="15">quality · speed</text>
  <rect x="280" y="290" width="200" height="158" rx="12" fill="#2563eb"/><text x="380" y="332" text-anchor="middle" fill="white" font-size="20" font-weight="700">过程可解释</text><text x="380" y="362" text-anchor="middle" fill="#dbeafe" font-size="15">sources · reasons</text>
  <rect x="480" y="210" width="200" height="238" rx="12" fill="#0ea5e9"/><text x="580" y="254" text-anchor="middle" fill="white" font-size="20" font-weight="700">结果可验证</text><text x="580" y="284" text-anchor="middle" fill="#e0f2fe" font-size="15">baseline · uplift</text>
  <rect x="680" y="130" width="200" height="318" rx="12" fill="#14b8a6"/><text x="780" y="176" text-anchor="middle" fill="white" font-size="20" font-weight="700">能力可迁移</text><text x="780" y="206" text-anchor="middle" fill="#ccfbf1" font-size="15">retention · transfer</text></g>
  <path d="M118 112 H842" stroke="#334155" stroke-width="2"/><text x="64" y="488" fill="#94a3b8" font-family="sans-serif" font-size="16">从使用量到可持续组织能力 →</text>
</svg>
