<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Agent Safety Stop Stack</title><desc id="desc">Four control layers from objective to safe stopping for persistent AI agents.</desc>
  <rect width="1200" height="680" rx="32" fill="#071525"/>
  <text x="70" y="82" fill="#eef6ff" font-family="sans-serif" font-size="38" font-weight="700">Agent Safety Stop Stack</text>
  <text x="70" y="124" fill="#91a9c5" font-family="sans-serif" font-size="20">能力扩张之前，先证明系统能在正确时刻停下</text>
  <g font-family="sans-serif">
    <rect x="90" y="190" width="1020" height="82" rx="18" fill="#17365d"/><text x="125" y="225" fill="#7dd3fc" font-size="20">01 OBJECTIVE</text><text x="370" y="238" fill="#fff" font-size="25" font-weight="700">目标、奖励与证伪条件</text><text x="930" y="238" fill="#bae6fd" font-size="18">无解时退出</text>
    <rect x="130" y="292" width="940" height="82" rx="18" fill="#164e63"/><text x="165" y="327" fill="#67e8f9" font-size="20">02 EXECUTION</text><text x="410" y="340" fill="#fff" font-size="25" font-weight="700">工具、时长与调用预算</text><text x="890" y="340" fill="#cffafe" font-size="18">超限时冻结</text>
    <rect x="170" y="394" width="860" height="82" rx="18" fill="#14532d"/><text x="205" y="429" fill="#86efac" font-size="20">03 BOUNDARY</text><text x="450" y="442" fill="#fff" font-size="25" font-weight="700">身份、网络与共享服务</text><text x="850" y="442" fill="#dcfce7" font-size="18">越界时隔离</text>
    <rect x="210" y="496" width="780" height="82" rx="18" fill="#713f12"/><text x="245" y="531" fill="#fde68a" font-size="20">04 STOP &amp; AUDIT</text><text x="510" y="544" fill="#fff" font-size="25" font-weight="700">撤权、接管与证据</text><text x="830" y="544" fill="#fef3c7" font-size="18">事故可复盘</text>
  </g>
</svg>
