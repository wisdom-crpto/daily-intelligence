<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Claim-to-Evidence Gate</title><desc id="desc">AI claims pass through replay, production and capital gates before scaling.</desc>
  <rect width="1200" height="680" rx="32" fill="#071525"/><text x="70" y="85" fill="#eef6ff" font-family="sans-serif" font-size="38" font-weight="700">Claim-to-Evidence Gate</text><text x="70" y="125" fill="#91a9c5" font-family="sans-serif" font-size="20">从技术承诺到规模化预算，四道证据门缺一不可</text>
  <g font-family="sans-serif"><rect x="70" y="210" width="225" height="210" rx="22" fill="#17365d"/><text x="95" y="265" fill="#7dd3fc" font-size="22">01 技术主张</text><text x="95" y="310" fill="#fff" font-size="27" font-weight="700">Demo / Claim</text><text x="95" y="350" fill="#c3d2e5" font-size="18">能力 · 峰值 · 案例</text>
  <rect x="335" y="210" width="225" height="210" rx="22" fill="#164e63"/><text x="360" y="265" fill="#67e8f9" font-size="22">02 受控回放</text><text x="360" y="310" fill="#fff" font-size="27" font-weight="700">Replay / Baseline</text><text x="360" y="350" fill="#c8eef3" font-size="18">质量 · 成本 · 失败</text>
  <rect x="600" y="210" width="225" height="210" rx="22" fill="#14532d"/><text x="625" y="265" fill="#86efac" font-size="22">03 生产结果</text><text x="625" y="310" fill="#fff" font-size="27" font-weight="700">Outcome / Audit</text><text x="625" y="350" fill="#d1f5dc" font-size="18">返工 · 权限 · 现金流</text>
  <rect x="865" y="210" width="265" height="210" rx="22" fill="#713f12"/><text x="890" y="265" fill="#fde68a" font-size="22">04 资本筛选</text><text x="890" y="310" fill="#fff" font-size="27" font-weight="700">GDP / Profit / PCE</text><text x="890" y="350" fill="#fae8b5" font-size="18">增长 · 利润 · 贴现率</text>
  <path d="M295 315h40M560 315h40M825 315h40" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round"/><rect x="245" y="500" width="710" height="92" rx="46" fill="#15253b" stroke="#3c5575"/><text x="600" y="540" text-anchor="middle" fill="#eef6ff" font-size="23">Scale only when evidence survives every gate</text><text x="600" y="570" text-anchor="middle" fill="#9fb2ca" font-size="19">只有可复现改善，才进入下一轮预算</text></g>
</svg>
